<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WPL Safety Inspection</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f3;color:#1a1a18;font-size:15px}
.container{max-width:780px;margin:0 auto;padding:1.5rem 1rem}
h1{font-size:18px;font-weight:600;margin-bottom:4px}
.subtitle{font-size:13px;color:#666;margin-bottom:1.2rem}
.top-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:1.2rem}

/* ── SUMMARY STATS ── */
.summary{display:flex;gap:8px;margin-bottom:1.2rem}
.stat{flex:1;padding:10px 8px;border-radius:8px;background:#fff;border:1px solid #e0e0e0;text-align:center}
.stat-n{font-size:22px;font-weight:600}
.stat-l{font-size:11px;color:#888;margin-top:2px}

/* ── TABS ── */
.tabs{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap}
.tab{padding:6px 14px;font-size:13px;border:1px solid #d0d0d0;border-radius:6px;background:#fff;color:#555;cursor:pointer;transition:all .15s}
.tab:hover{background:#f0f0ee}
.tab.active{background:#1a1a18;color:#fff;border-color:#1a1a18;font-weight:500}
.badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:10px;margin-left:4px;background:rgba(255,255,255,.2)}
.tab:not(.active) .badge{background:#eee;color:#888}
.tab.all-done:not(.active){border-color:#1D9E75;color:#0F6E56}

/* ── PROGRESS ── */
.pbar{height:5px;border-radius:3px;background:#e0e0e0;margin-bottom:1rem;overflow:hidden}
.pfill{height:100%;border-radius:3px;background:#1D9E75;transition:width .4s}

/* ── FILTERS ── */
.frow{display:flex;gap:6px;margin-bottom:.8rem;align-items:center;flex-wrap:wrap}
.frow label{font-size:12px;color:#888}
.fbtn{padding:3px 10px;font-size:12px;border:1px solid #d0d0d0;border-radius:10px;background:#fff;color:#666;cursor:pointer}
.fbtn.active{background:#1a1a18;color:#fff;border-color:#1a1a18}

/* ── SECTION LABEL ── */
.sec-lbl{font-size:11px;font-weight:600;color:#999;letter-spacing:.06em;text-transform:uppercase;margin:1.2rem 0 .4rem;padding-bottom:.3rem;border-bottom:1px solid #e8e8e8}
.sec-lbl:first-of-type{margin-top:0}

/* ── CHECKLIST ITEMS ── */
.item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;border:1px solid #e8e8e8;background:#fff;margin-bottom:5px}
.item.passed{border-color:#9FE1CB;background:#f0fbf7}
.item.flagged{border-color:#f0c040;background:#fffbee}
.item.na-item{opacity:.55}

.circle{width:24px;height:24px;border-radius:50%;border:1.5px solid #ccc;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.item.passed .circle{background:#1D9E75;border-color:#1D9E75}
.item.flagged .circle{background:#f0c040;border-color:#d4a800}
.item.na-item .circle{cursor:default}
.ck{display:none}
.item.passed .ck{display:block}

.iinfo{flex:1;min-width:0;cursor:pointer;user-select:none}
.item.na-item .iinfo{cursor:default}
.itype{font-size:13px;font-weight:600}
.iloc{font-size:12px;color:#777;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iflag-note{font-size:11px;color:#856404;margin-top:2px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.item-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.imeta{font-size:10px;color:#555;text-align:right;line-height:1.4}
.sig-thumb{height:20px;max-width:56px;display:block;margin-top:2px;margin-left:auto;opacity:.85}

.na-pill{font-size:11px;padding:2px 8px;border-radius:10px;background:#fff3cd;color:#856404;white-space:nowrap;border:1px solid #ffe083}

/* icon buttons */
.icon-btn{width:30px;height:30px;border-radius:6px;border:1px solid #d0d0d0;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .15s;color:#555;padding:0}
.icon-btn:hover{background:#f0f0f0;border-color:#aaa}
.icon-btn.flag-set{color:#d4a800;border-color:#f0c040;background:#fffbee;cursor:default}
.icon-btn svg{width:15px;height:15px;display:block}

/* ── ACTIONS ── */
.actions{display:flex;gap:8px;margin-top:1.4rem;flex-wrap:wrap}
button.btn{padding:7px 16px;font-size:13px;border:1px solid #ccc;border-radius:6px;background:#fff;color:#333;cursor:pointer;font-weight:500}
button.btn:hover{background:#f0f0f0}
button.btn:disabled{opacity:.45;cursor:default}
button.btn.ok{background:#1D9E75;color:#fff;border-color:#1D9E75}
button.btn.ok:hover:not(:disabled){background:#0F6E56}
button.btn.danger{color:#c0392b;border-color:#e0b0b0}

.empty{padding:2rem;text-align:center;font-size:14px;color:#999}

/* ── TOAST ── */
.toast{position:fixed;bottom:20px;right:20px;padding:8px 16px;border-radius:8px;background:#1a1a18;color:#fff;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:300;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.toast.on{opacity:1}

/* ── SIGNATURE OVERLAY ── */
#sig-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem}
.sig-card{background:#fff;border-radius:12px;padding:1.5rem;width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
.sig-heading{font-size:16px;font-weight:600;text-align:center}
.sig-sub{font-size:12px;color:#888;text-align:center;margin-top:-6px}
#sig-canvas{width:100%;height:110px;border:1.5px solid #ccc;border-radius:8px;cursor:crosshair;touch-action:none;background:#fafafa;display:block}
.sig-actions{display:flex;gap:8px;justify-content:flex-end}

/* ── FLAG PANEL ── */
#flag-backdrop{display:none;position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.3)}
#flag-panel{display:none;position:fixed;bottom:0;left:0;right:0;z-index:160;background:#fff;border-top:1px solid #e0e0e0;border-radius:16px 16px 0 0;padding:1.25rem 1rem 2rem;max-width:780px;margin:0 auto}
#flag-panel.open{display:block}
#flag-backdrop.open{display:block}
.flag-label{font-size:14px;font-weight:600;margin-bottom:8px}
#flag-note{width:100%;font-size:14px;padding:10px 12px;border:1px solid #ccc;border-radius:8px;resize:none;font-family:inherit;line-height:1.5}
#flag-note:focus{outline:none;border-color:#888}
.flag-confirm{margin-top:10px;width:100%;padding:10px;font-size:14px;font-weight:600;background:#d4a800;color:#fff;border:none;border-radius:8px;cursor:pointer}
.flag-confirm:hover{background:#b38f00}

/* ── PHOTO LIGHTBOX ── */
#lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;flex-direction:column;align-items:center;justify-content:center;padding:1rem}
#lb.open{display:flex}
.lb-inner{max-width:680px;width:100%;display:flex;flex-direction:column;gap:12px}
.lb-title{color:#fff;font-size:14px;font-weight:600;text-align:center}
.lb-sub{color:#aaa;font-size:12px;text-align:center;margin-top:-6px}
.lb-img-wrap{display:flex;align-items:center;justify-content:center;min-height:200px}
.lb-img-wrap img{max-width:100%;max-height:70vh;border-radius:8px;object-fit:contain}
.lb-no-photo{color:#aaa;font-size:14px;text-align:center;padding:3rem 0}
.lb-close{align-self:center;padding:8px 28px;font-size:14px;border:1px solid rgba(255,255,255,.3);border-radius:6px;background:transparent;color:#fff;cursor:pointer;margin-top:4px}
.lb-close:hover{background:rgba(255,255,255,.1)}

@media print{.actions,.frow,.tabs,.toast,#lb,#flag-panel,#flag-backdrop,#sig-overlay{display:none!important}.pbar{display:none}}
@media(max-width:520px){.summary{flex-wrap:wrap}.stat{min-width:calc(50% - 4px)}}
</style>

<!-- ── PHOTO LIGHTBOX ── -->

</div>

/* ─── STATE ─── */
// Persisted: { items: { key: {type,date,note} }, sigs: { 'MM/DD/YYYY': dataURL } }
// Session-only: sessionSig (dataURL drawn this session)
const SK = 'wpl_insp_v3';
let state = { items: {}, sigs: {} };
let sessionSig = null;
let cur = 0, filt = 'all';
let pendingFlag = null; // {bi, itemIdx} while flag panel is open

function load() {
  try {
    const raw = localStorage.getItem(SK);
    if (raw) state = JSON.parse(raw);
    if (!state.items) state.items = {};
    if (!state.sigs) state.sigs = {};
  } catch(e) {}
}
function save() {
  try { localStorage.setItem(SK, JSON.stringify(state)); } catch(e) {}
}
function today() {
  return new Date().toLocaleDateString('en-US', {month:'2-digit', day:'2-digit', year:'numeric'});
}
function key(b, i) { return b + '_' + i; }

/* ─── SIGNATURE PAD ─── */
let sigCtx, sigDrawing = false, sigHasDrawn = false;

function initSigPad() {
  const canvas = document.getElementById('sig-canvas');
  // Size canvas pixels to match display size
  const w = canvas.offsetWidth || 360;
  canvas.width = w;
  canvas.height = 110;
  sigCtx = canvas.getContext('2d');
  sigCtx.strokeStyle = '#1a1a18';
  sigCtx.lineWidth = 2.5;
  sigCtx.lineCap = 'round';
  sigCtx.lineJoin = 'round';

  function pos(e) {
    const r = canvas.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return {
      x: (src.clientX - r.left) * (canvas.width / r.width),
      y: (src.clientY - r.top) * (canvas.height / r.height)
    };
  }
  canvas.addEventListener('mousedown', e => { sigDrawing = true; const p = pos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y); });
  canvas.addEventListener('mousemove', e => { if (!sigDrawing) return; const p = pos(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); markDrawn(); });
  canvas.addEventListener('mouseup', () => sigDrawing = false);
  canvas.addEventListener('mouseleave', () => sigDrawing = false);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); sigDrawing = true; const p = pos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y); }, {passive:false});
  canvas.addEventListener('touchmove', e => { e.preventDefault(); if (!sigDrawing) return; const p = pos(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); markDrawn(); }, {passive:false});
  canvas.addEventListener('touchend', () => sigDrawing = false);
}

function markDrawn() {
  if (!sigHasDrawn) {
    sigHasDrawn = true;
    document.getElementById('sig-accept').disabled = false;
  }
}

function clearSig() {
  const canvas = document.getElementById('sig-canvas');
  sigCtx.clearRect(0, 0, canvas.width, canvas.height);
  sigHasDrawn = false;
  document.getElementById('sig-accept').disabled = true;
}

function acceptSig() {
  const canvas = document.getElementById('sig-canvas');
  sessionSig = canvas.toDataURL('image/jpeg', 0.6);
  document.getElementById('sig-overlay').style.display = 'none';
  document.getElementById('main-app').style.display = 'block';
  render();
}

/* ─── PASS / FLAG ACTIONS ─── */
function passItem(bi, itemIdx) {
  const it = B[bi].items[itemIdx];
  if (it.na) return;
  const k = key(bi, itemIdx);
  const existing = state.items[k];
  // If already passed, toggle off. If flagged, do nothing.
  if (existing && existing.type === 'pass') {
    delete state.items[k];
  } else if (!existing) {
    const d = today();
    state.sigs[d] = sessionSig;
    state.items[k] = { type: 'pass', date: d };
  }
  save(); render();
}

function openFlagPanel(bi, itemIdx, event) {
  event.stopPropagation();
  const k = key(bi, itemIdx);
  if (state.items[k] && state.items[k].type === 'flag') return; // already flagged, no edit
  pendingFlag = { bi, itemIdx };
  document.getElementById('flag-note').value = '';
  document.getElementById('flag-panel').classList.add('open');
  document.getElementById('flag-backdrop').classList.add('open');
  setTimeout(() => document.getElementById('flag-note').focus(), 100);
}

function closeFlagPanel() {
  pendingFlag = null;
  document.getElementById('flag-panel').classList.remove('open');
  document.getElementById('flag-backdrop').classList.remove('open');
}

function confirmFlag() {
  if (!pendingFlag) return;
  const note = document.getElementById('flag-note').value.trim();
  if (!note) { document.getElementById('flag-note').focus(); return; }
  const { bi, itemIdx } = pendingFlag;
  const d = today();
  state.sigs[d] = sessionSig;
  state.items[key(bi, itemIdx)] = { type: 'flag', date: d, note };
  save();
  closeFlagPanel();
  render();
}

/* ─── RENDER ─── */
function stats(bi) {
  let insp = 0, passed = 0, flagged = 0, tot = B[bi].items.length;
  B[bi].items.forEach((it, i) => {
    if (it.na) return;
    insp++;
    const r = state.items[key(bi, i)];
    if (r && r.type === 'pass') passed++;
    if (r && r.type === 'flag') flagged++;
  });
  return { tot, insp, passed, flagged, done: passed + flagged };
}

function renderGS() {
  let ti = 0, tdone = 0, tpass = 0, tflag = 0, tt = 0;
  B.forEach((_, bi) => { const s = stats(bi); ti += s.insp; tdone += s.done; tpass += s.passed; tflag += s.flagged; tt += s.tot; });
  const p = ti ? Math.round(tdone / ti * 100) : 0;
  document.getElementById('gsumm').innerHTML =
    `<div class="stat"><div class="stat-n" style="color:#1D9E75">${tpass}</div><div class="stat-l">Passed</div></div>` +
    `<div class="stat"><div class="stat-n" style="color:#d4a800">${tflag}</div><div class="stat-l">Flagged</div></div>` +
    `<div class="stat"><div class="stat-n">${ti - tdone}</div><div class="stat-l">Remaining</div></div>` +
    `<div class="stat"><div class="stat-n">${p}%</div><div class="stat-l">Complete</div></div>`;
}

function renderTabs() {
  document.getElementById('btabs').innerHTML = B.map((b, i) => {
    const s = stats(i);
    const allDone = s.done === s.insp && s.insp > 0;
    return `<button class="tab${i === cur ? ' active' : ''}${allDone ? ' all-done' : ''}" onclick="switchB(${i})">${b.name}<span class="badge">${s.done}/${s.insp}</span></button>`;
  }).join('');
}

function renderProg() {
  const s = stats(cur);
  document.getElementById('bprog').style.width = (s.insp ? Math.round(s.done / s.insp * 100) : 0) + '%';
}

const CAM_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>`;
const FLAG_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>`;
const CHECK_ICON = `<svg class="ck" width="12" height="10" viewBox="0 0 12 10" fill="none"><path d="M1 5L4.2 8.5L11 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function renderCL() {
  const items = B[cur].items;
  const cats = { 'Exit Signs & Emergency Lights': [], 'Fire Extinguishers': [], 'AEDs': [], 'Sprinkler Valves': [] };

  items.forEach((it, i) => {
    const k = key(cur, i);
    const rec = state.items[k];
    const isPassed = rec && rec.type === 'pass';
    const isFlagged = rec && rec.type === 'flag';
    const isDone = isPassed || isFlagged;

    if (filt === 'pending' && (isDone || it.na)) return;
    if (filt === 'passed' && !isPassed) return;
    if (filt === 'flagged' && !isFlagged) return;

    const cat = it.t.includes('Fire') ? 'Fire Extinguishers' : it.t.includes('AED') ? 'AEDs' : it.t.includes('Sprinkler') ? 'Sprinkler Valves' : 'Exit Signs & Emergency Lights';
    cats[cat].push({ it, i, rec, isPassed, isFlagged });
  });

  let html = '';
  ['Exit Signs & Emergency Lights', 'Fire Extinguishers', 'AEDs', 'Sprinkler Valves'].forEach(cat => {
    const arr = cats[cat]; if (!arr || !arr.length) return;
    html += `<div class="sec-lbl">${cat}</div>`;
    arr.forEach(({ it, i, rec, isPassed, isFlagged }) => {
      const cls = isPassed ? ' passed' : isFlagged ? ' flagged' : '';
      const naCls = it.na ? ' na-item' : '';

      // Signature thumbnail
      let sigHtml = '';
      if (rec && state.sigs[rec.date]) {
        sigHtml = `<img class="sig-thumb" src="${state.sigs[rec.date]}" alt="signature">`;
      }

      // Meta column
      let meta = '';
      if (it.na) {
        meta = `<span class="na-pill">Sign physical tag</span>`;
      } else if (rec) {
        meta = `<div class="imeta">${rec.date}${sigHtml}</div>`;
      }

      // Flag button — filled if already flagged
      const flagCls = isFlagged ? ' flag-set' : '';
      const flagClick = isFlagged ? '' : `onclick="openFlagPanel(${cur},${i},event)"`;
      const flagTitle = isFlagged ? 'Issue flagged' : 'Flag an issue';
      const flagBtn = `<button class="icon-btn${flagCls}" title="${flagTitle}" ${flagClick}>${FLAG_ICON}</button>`;

      // Camera button
      const camBtn = `<button class="icon-btn" title="View photo" onclick="openPhoto(${cur},${i},event)">${CAM_ICON}</button>`;

      // Flag note display
      const noteHtml = isFlagged ? `<div class="iflag-note">&#9888; ${rec.note}</div>` : '';

      html += `<div class="item${cls}${naCls}">
        <div class="circle" onclick="passItem(${cur},${i})">${CHECK_ICON}</div>
        <div class="iinfo" onclick="passItem(${cur},${i})">
          <div class="itype">${it.t}</div>
          <div class="iloc">${it.l}</div>
          ${noteHtml}
        </div>
        <div class="item-right">
          ${it.na ? `<span class="na-pill">Sign physical tag</span>` : rec ? `<div class="imeta">${rec.date}${sigHtml}</div>` : ''}
          ${it.na ? '' : flagBtn}
          ${camBtn}
        </div>
      </div>`;
    });
  });
  document.getElementById('cl').innerHTML = html || '<div class="empty">No items to show.</div>';
}

function render() { renderGS(); renderTabs(); renderProg(); renderCL(); }
function switchB(i) { cur = i; render(); }
function setF(f, el) { filt = f; document.querySelectorAll('.fbtn').forEach(x => x.classList.remove('active')); el.classList.add('active'); renderCL(); }
function showToast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2200); }

/* ─── PHOTO LIGHTBOX ─── */
function openPhoto(bi, itemIdx, event) {
  event.stopPropagation();
  const branch = B[bi], it = branch.items[itemIdx];
  const num = String(itemIdx + 1).padStart(3, '0');
  document.getElementById('lb-title').textContent = it.t + ' — ' + it.l;
  document.getElementById('lb-sub').textContent = branch.name + ' Branch  •  Photo #' + num;
  const wrap = document.getElementById('lb-img-wrap');
  wrap.innerHTML = '<div style="color:#aaa;font-size:13px">Loading…</div>';
  const tryLoad = (src, fallback) => {
    const img = new Image();
    img.style.cssText = 'max-width:100%;max-height:70vh;border-radius:8px;object-fit:contain';
    img.onload = () => { wrap.innerHTML = ''; wrap.appendChild(img); };
    img.onerror = fallback;
    img.src = src;
  };
  tryLoad(`photos/${branch.folder}/${num}.jpg`,
    () => tryLoad(`photos/${branch.folder}/${num}.JPG`,
      () => { wrap.innerHTML = `<div class="lb-no-photo">No photo on file yet.<br><span style="font-size:11px;opacity:.6">Add photos/${branch.folder}/${num}.jpg to the repository.</span></div>`; }
    )
  );
  document.getElementById('lb').classList.add('open');
}
function closeLB(event) {
  if (!event || event.target === document.getElementById('lb') || event.target.classList.contains('lb-close')) {
    document.getElementById('lb').classList.remove('open');
  }
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { document.getElementById('lb').classList.remove('open'); closeFlagPanel(); } });

/* ─── PDF EXPORT ─── */
function doExport() {
  const d = today();

  // Collect all flagged items across all branches
  const flagged = [];
  B.forEach((branch, bi) => {
    branch.items.forEach((it, i) => {
      const rec = state.items[key(bi, i)];
      if (rec && rec.type === 'flag') flagged.push({ branch: branch.name, it, rec });
    });
  });

  // Build branch tables
  const branchHTML = B.map((branch, bi) => {
    const s = stats(bi);
    const rows = branch.items.map((it, i) => {
      const rec = state.items[key(bi, i)];
      const sig = rec && state.sigs[rec.date] ? `<img src="${state.sigs[rec.date]}" style="height:18px;max-width:60px;vertical-align:middle;opacity:.9">` : '';
      let statusCell, rowStyle = '';
      if (it.na) {
        statusCell = `<td class="status"><span class="tag-pill">Sign physical tag</span></td><td></td><td></td>`;
      } else if (!rec) {
        statusCell = `<td class="status pending">Pending</td><td></td><td></td>`;
      } else if (rec.type === 'pass') {
        statusCell = `<td class="status pass">Pass</td><td class="date-cell">${rec.date}</td><td class="sig-cell">${sig}</td>`;
      } else {
        rowStyle = ' class="flag-row"';
        statusCell = `<td class="status flag">&#9888; Flagged</td><td class="date-cell">${rec.date}</td><td class="sig-cell">${sig}</td>`;
      }
      const noteCell = (rec && rec.type === 'flag') ? `<tr${rowStyle}><td colspan="2" style="padding:0 8px 6px 28px;font-size:10pt;color:#856404;font-style:italic">Note: ${rec.note}</td><td colspan="2"></td></tr>` : '';
      return `<tr${rowStyle}><td class="type-cell">${it.t}</td><td class="loc-cell">${it.l}</td>${statusCell}</tr>${noteCell}`;
    }).join('');

    return `<div class="branch-section">
      <div class="branch-header">${branch.name} Branch <span class="branch-stat">${s.passed} passed &nbsp;|&nbsp; ${s.flagged} flagged &nbsp;|&nbsp; ${s.insp - s.done} pending</span></div>
      <table>
        <thead><tr><th style="width:22%">Type</th><th>Location</th><th style="width:10%">Status</th><th style="width:11%">Date</th><th style="width:9%">Signature</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }).join('');

  // Flagged summary
  const flagSummary = flagged.length === 0
    ? `<div class="no-flags">No issues flagged during this inspection.</div>`
    : `<table class="flag-table">
        <thead><tr><th>Branch</th><th>Type</th><th>Location</th><th>Issue</th><th>Date</th><th>Signature</th></tr></thead>
        <tbody>${flagged.map(({ branch, it, rec }) => {
          const sig = state.sigs[rec.date] ? `<img src="${state.sigs[rec.date]}" style="height:18px;max-width:60px;vertical-align:middle">` : '';
          return `<tr><td>${branch}</td><td>${it.t}</td><td>${it.l}</td><td style="color:#856404;font-style:italic">${rec.note}</td><td>${rec.date}</td><td>${sig}</td></tr>`;
        }).join('')}</tbody>
      </table>`;

  const win = window.open('', '_blank');
  win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>WPL Inspection Report — ${d}</title>
<style>

body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:10pt;color:#1a1a18;padding:0;background:#fff}

.report-title{font-size:16pt;font-weight:700}
.report-sub{font-size:10pt;color:#666;margin-top:3px}

.section-heading{font-size:12pt;font-weight:700;margin:1.2rem 0 .4rem;padding:.3rem .5rem;background:#1a1a18;color:#fff;border-radius:3px}
.flag-table{width:100%;border-collapse:collapse;margin-bottom:.5rem;font-size:9.5pt}
.flag-table th{background:#d4a800;color:#fff;padding:4px 8px;text-align:left;font-size:9pt}
.flag-table td{padding:4px 8px;border-bottom:1px solid #f0e0a0;vertical-align:middle}
.flag-table tr:nth-child(even) td{background:#fffbee}

  <div><div class="report-title">Safety Inspection Report</div><div class="report-sub">Wicomico Public Library</div></div>
  <div class="report-meta">Generated: ${new Date().toLocaleString()}</div>
</div>

  win.document.close();
}

/* ─── RESET ─── */
function doReset() {
  if (!confirm(`Reset all inspections for ${B[cur].name} branch?`)) return;
  B[cur].items.forEach((_, i) => delete state.items[key(cur, i)]);
  save(); render(); showToast(`${B[cur].name} reset.`);
}
function doResetAll() {
  if (!confirm('Reset ALL branches? This cannot be undone.')) return;
  state = { items: {}, sigs: {} }; save(); render(); showToast('All branches reset.');
}

/* ─── INIT ─── */
load();
