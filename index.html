<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WPL Safety Inspection</title>
<style>
/* ── RESET & BASE ── */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f3;color:#1a1a18;font-size:15px}
.container{max-width:780px;margin:0 auto;padding:1.5rem 1rem}

/* ── HEADER ── */
h1{font-size:18px;font-weight:600;margin-bottom:4px}
.subtitle{font-size:13px;color:#666;margin-bottom:1.2rem}
.top-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:1.2rem}

/* ── SUMMARY STATS ── */
.summary{display:flex;gap:8px;margin-bottom:1.2rem}
.stat{flex:1;padding:10px 8px;border-radius:8px;background:#fff;border:1px solid #e0e0e0;text-align:center}
.stat-n{font-size:22px;font-weight:600}
.stat-l{font-size:11px;color:#888;margin-top:2px}

/* ── BRANCH TABS ── */
.tabs{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap}
.tab{padding:6px 14px;font-size:13px;border:1px solid #d0d0d0;border-radius:6px;background:#fff;color:#555;cursor:pointer;transition:all .15s}
.tab:hover{background:#f0f0ee}
.tab.active{background:#1a1a18;color:#fff;border-color:#1a1a18;font-weight:500}
.badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:10px;margin-left:4px;background:rgba(255,255,255,.2)}
.tab:not(.active) .badge{background:#eee;color:#888}
.tab.all-done:not(.active){border-color:#1D9E75;color:#0F6E56}

/* ── PROGRESS BAR ── */
.pbar{height:5px;border-radius:3px;background:#e0e0e0;margin-bottom:1rem;overflow:hidden}
.pfill{height:100%;border-radius:3px;background:#1D9E75;transition:width .4s}

/* ── FILTER BUTTONS ── */
.frow{display:flex;gap:6px;margin-bottom:.8rem;align-items:center;flex-wrap:wrap}
.frow label{font-size:12px;color:#888}
.fbtn{padding:3px 10px;font-size:12px;border:1px solid #d0d0d0;border-radius:10px;background:#fff;color:#666;cursor:pointer}
.fbtn.active{background:#1a1a18;color:#fff;border-color:#1a1a18}

/* ── WALKTHROUGH DIVIDERS ── */
.proceed{display:flex;align-items:center;gap:8px;margin:1rem 0 .5rem;font-size:12px;font-weight:600;color:#888;letter-spacing:.03em;text-transform:uppercase}
.proceed::before,.proceed::after{content:'';flex:1;height:1px;background:#ddd}

/* ── CHECKLIST ITEMS ── */
.item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;border:1px solid #e8e8e8;background:#fff;margin-bottom:5px}
.item.passed{border-color:#9FE1CB;background:#f0fbf7}
.item.flagged{border-color:#f0c040;background:#fffbee}
.item.na-item{opacity:.55}

.circle{width:24px;height:24px;border-radius:50%;border:1.5px solid #ccc;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.item.passed .circle{background:#1D9E75;border-color:#1D9E75}
.item.flagged .circle{background:#f0c040;border-color:#d4a800}
.item.na-item .circle{cursor:default}
.ck{display:none}
.item.passed .ck{display:block}

.iinfo{flex:1;min-width:0;cursor:pointer;user-select:none}
.item.na-item .iinfo{cursor:default}
.itype{font-size:13px;font-weight:600}
.iloc{font-size:12px;color:#777;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iflag-note{font-size:11px;color:#856404;margin-top:2px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.item-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.imeta{font-size:10px;color:#555;text-align:right;line-height:1.4}
.sig-thumb{height:20px;max-width:56px;display:block;margin-top:2px;margin-left:auto;opacity:.85}
.na-pill{font-size:11px;padding:2px 8px;border-radius:10px;background:#fff3cd;color:#856404;white-space:nowrap;border:1px solid #ffe083}

/* ── ICON BUTTONS (camera, flag) ── */
.icon-btn{width:30px;height:30px;border-radius:6px;border:1px solid #d0d0d0;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .15s;color:#555;padding:0}
.icon-btn:hover{background:#f0f0f0;border-color:#aaa}
.icon-btn.flag-set{color:#d4a800;border-color:#f0c040;background:#fffbee;cursor:default}
.icon-btn svg{width:15px;height:15px;display:block}

/* ── ACTION BUTTONS ── */
.actions{display:flex;gap:8px;margin-top:1.4rem;flex-wrap:wrap}
button.btn{padding:7px 16px;font-size:13px;border:1px solid #ccc;border-radius:6px;background:#fff;color:#333;cursor:pointer;font-weight:500}
button.btn:hover{background:#f0f0f0}
button.btn.ok{background:#1D9E75;color:#fff;border-color:#1D9E75}
button.btn.ok:hover{background:#0F6E56}
button.btn.danger{color:#c0392b;border-color:#e0b0b0}

/* ── EMPTY STATE ── */
.empty{padding:2rem;text-align:center;font-size:14px;color:#999}

/* ── TOAST NOTIFICATION ── */
.toast{position:fixed;bottom:20px;right:20px;padding:8px 16px;border-radius:8px;background:#1a1a18;color:#fff;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:300;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.toast.on{opacity:1}

/* ── SIGNATURE OVERLAY ── */
#sig-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem}
.sig-card{background:#fff;border-radius:12px;padding:1.5rem;width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
.sig-heading{font-size:16px;font-weight:600;text-align:center}
.sig-sub{font-size:12px;color:#888;text-align:center;margin-top:-6px}
#sig-canvas{width:100%;height:120px;border:1.5px solid #ccc;border-radius:8px;cursor:crosshair;touch-action:none;background:#fafafa;display:block}
.sig-actions{display:flex;gap:8px;justify-content:flex-end}

/* ── FLAG PANEL ── */
#flag-backdrop{display:none;position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.3)}
#flag-panel{display:none;position:fixed;bottom:0;left:0;right:0;z-index:160;background:#fff;border-top:1px solid #e0e0e0;border-radius:16px 16px 0 0;padding:1.25rem 1rem 2rem}
#flag-panel.open{display:block}
#flag-backdrop.open{display:block}
.flag-label{font-size:14px;font-weight:600;margin-bottom:8px}
#flag-note{width:100%;font-size:14px;padding:10px 12px;border:1px solid #ccc;border-radius:8px;resize:none;font-family:inherit;line-height:1.5}
#flag-note:focus{outline:none;border-color:#888}
.flag-confirm{margin-top:10px;width:100%;padding:10px;font-size:14px;font-weight:600;background:#d4a800;color:#fff;border:none;border-radius:8px;cursor:pointer}
.flag-confirm:hover{background:#b38f00}

/* ── PHOTO LIGHTBOX ── */
#lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;flex-direction:column;align-items:center;justify-content:center;padding:1rem}
#lb.open{display:flex}
.lb-inner{max-width:680px;width:100%;display:flex;flex-direction:column;gap:12px}
.lb-title{color:#fff;font-size:14px;font-weight:600;text-align:center}
.lb-sub{color:#aaa;font-size:12px;text-align:center;margin-top:-6px}
.lb-img-wrap{display:flex;align-items:center;justify-content:center;min-height:200px}
.lb-img-wrap img{max-width:100%;max-height:70vh;border-radius:8px;object-fit:contain}
.lb-no-photo{color:#aaa;font-size:14px;text-align:center;padding:3rem 0}
.lb-close{align-self:center;padding:8px 28px;font-size:14px;border:1px solid rgba(255,255,255,.3);border-radius:6px;background:transparent;color:#fff;cursor:pointer;margin-top:4px}
.lb-close:hover{background:rgba(255,255,255,.1)}

/* ── PRINT / RESPONSIVE ── */
@media print{
  .actions,.frow,.tabs,.toast,#lb,#flag-panel,#flag-backdrop,#sig-overlay,.container{display:none!important}
  #report-overlay{position:static!important;padding:0!important}
  #report-overlay .btn{display:none!important}
}
@media(max-width:520px){.summary{flex-wrap:wrap}.stat{min-width:calc(50% - 4px)}}
</style>

<body>

<!-- SIGNATURE OVERLAY -->
<div id="sig-overlay">
  <div class="sig-card">
    <div class="sig-heading">Draw your initials</div>
    <div class="sig-sub">Used to sign off each item — this session only</div>
    <canvas id="sig-canvas"></canvas>
    <div class="sig-actions">
      <button class="btn" onclick="clearSig()">Clear</button>
      <button class="btn ok" id="sig-accept" disabled onclick="acceptSig()">Begin Inspection</button>
    </div>
  </div>
</div>

<!-- FLAG PANEL -->
<div id="flag-backdrop" onclick="closeFlagPanel()"></div>
<div id="flag-panel">
  <div class="flag-label">Describe the issue</div>
  <textarea id="flag-note" rows="3" placeholder="e.g. dead battery, cover cracked, light not functioning…"></textarea>
  <button class="flag-confirm" onclick="confirmFlag()">Flag this item</button>
</div>

<!-- MAIN APP -->
<div class="container" id="main-app" style="display:none">
  <div class="top-bar">
    <div>
      <h1>Safety Inspection Checklist</h1>
      <div class="subtitle">Wicomico Public Library</div>
    </div>
    <div id="last-saved" style="font-size:11px;color:#aaa;text-align:right;line-height:1.4"></div>
  </div>
  <div class="summary" id="gsumm"></div>
  <div class="tabs" id="btabs"></div>
  <div class="frow">
    <label>Show:</label>
    <button class="fbtn active" onclick="setF('all',this)">All</button>
    <button class="fbtn" onclick="setF('pending',this)">Pending</button>
    <button class="fbtn" onclick="setF('passed',this)">Passed</button>
    <button class="fbtn" onclick="setF('flagged',this)">Flagged</button>
  </div>
  <div class="pbar"><div class="pfill" id="bprog" style="width:0%"></div></div>
  <div id="cl"></div>
  <div class="actions">
    <button class="btn ok" onclick="doExport()">Export PDF</button>
    <button class="btn danger" onclick="doReset()">Reset this branch</button>
    <button class="btn danger" onclick="doResetAll()">Reset all</button>
  </div>
</div>

<!-- REPORT OVERLAY (mobile-friendly PDF export) -->
<div id="report-overlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:400;overflow-y:auto;padding:1rem">
  <div style="max-width:780px;margin:0 auto">
    <div style="display:flex;gap:8px;margin-bottom:1rem;position:sticky;top:0;background:#fff;padding:.5rem 0;border-bottom:1px solid #eee;z-index:1">
      <button class="btn ok" onclick="window.print()" style="flex:1">Save as PDF / Print</button>
      <button class="btn" onclick="closeReport()" style="flex:1">← Back to Inspection</button>
    </div>
    <div id="report-content"></div>
  </div>
</div>
<div id="lb" onclick="closeLB(event)">
  <div class="lb-inner">
    <div class="lb-title" id="lb-title"></div>
    <div class="lb-sub" id="lb-sub"></div>
    <div class="lb-img-wrap" id="lb-img-wrap"></div>
    <button class="lb-close" onclick="closeLB()">Close</button>
  </div>
</div>

<div class="toast" id="toast"></div>

/* ────────────────────────────────────────────
   STATE
   Persisted in localStorage:
     items  — { "bi_itemIdx": {type, date, note?} }
     sigs   — { "MM/DD/YYYY": dataURL }
   Session-only:
     sessionSig — drawn signature dataURL
──────────────────────────────────────────── */
const STORAGE_KEY = 'wpl_insp_v3';
let state = {items:{}, sigs:{}};
let sessionSig = null;
let currentBranch = 0;
let currentFilter = 'all';
let pendingFlag = null; // {bi, itemIdx} while flag panel is open

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = JSON.parse(raw);
    if (!state.items) state.items = {};
    if (!state.sigs)  state.sigs  = {};
  } catch(e) {
    showStorageWarning();
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    // Update last-saved indicator
    const el = document.getElementById('last-saved');
    if (el) el.textContent = 'Saved ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  } catch(e) {
    showStorageWarning();
  }
}

function showStorageWarning() {
  const el = document.getElementById('last-saved');
  if (el) {
    el.textContent = '⚠️ Progress may not be saving — avoid Private/Incognito mode';
    el.style.color = '#c0392b';
  }
}

// Check on startup whether localStorage is actually working
function checkStorage() {
  try {
    localStorage.setItem('_wpl_test', '1');
    localStorage.removeItem('_wpl_test');
  } catch(e) {
    showStorageWarning();
  }
}

function today() {
  return new Date().toLocaleDateString('en-US', {month:'2-digit', day:'2-digit', year:'numeric'});
}

function itemKey(bi, i) { return bi + '_' + i; }

/* ────────────────────────────────────────────
   PHOTO NUMBER PRE-COMPUTATION
   Assigned once at startup, skipping proceed
   dividers, matching reference.html exactly.
   Stored as a zero-padded string to avoid
   octal interpretation in inline onclick attrs.
──────────────────────────────────────────── */
BRANCHES.forEach(branch => {
  let n = 0;
  branch.items.forEach(it => {
    if (it.proceed) return;
    it.photoNum = String(++n).padStart(3, '0');
  });
});

/* ────────────────────────────────────────────
   SIGNATURE PAD
──────────────────────────────────────────── */
let sigCtx, sigDrawing = false, sigHasDrawn = false;

function initSigPad() {
  const canvas = document.getElementById('sig-canvas');
  canvas.width  = canvas.offsetWidth || 380;
  canvas.height = 120;
  sigCtx = canvas.getContext('2d');
  sigCtx.strokeStyle = '#1a1a18';
  sigCtx.lineWidth   = 2.5;
  sigCtx.lineCap     = 'round';
  sigCtx.lineJoin    = 'round';

  function getPos(e) {
    const r   = canvas.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return {
      x: (src.clientX - r.left) * (canvas.width  / r.width),
      y: (src.clientY - r.top)  * (canvas.height / r.height)
    };
  }

  function startDraw(e) {
    sigDrawing = true;
    const p = getPos(e);
    sigCtx.beginPath();
    sigCtx.moveTo(p.x, p.y);
  }

  function continueDraw(e) {
    if (!sigDrawing) return;
    const p = getPos(e);
    sigCtx.lineTo(p.x, p.y);
    sigCtx.stroke();
    if (!sigHasDrawn) {
      sigHasDrawn = true;
      document.getElementById('sig-accept').disabled = false;
    }
  }

  function endDraw() { sigDrawing = false; }

  canvas.addEventListener('mousedown',  startDraw);
  canvas.addEventListener('mousemove',  continueDraw);
  canvas.addEventListener('mouseup',    endDraw);
  canvas.addEventListener('mouseleave', endDraw);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); startDraw(e);    }, {passive:false});
  canvas.addEventListener('touchmove',  e => { e.preventDefault(); continueDraw(e); }, {passive:false});
  canvas.addEventListener('touchend',   endDraw);
}

function clearSig() {
  const canvas = document.getElementById('sig-canvas');
  sigCtx.clearRect(0, 0, canvas.width, canvas.height);
  sigHasDrawn = false;
  document.getElementById('sig-accept').disabled = true;
}

function acceptSig() {
  // Composite onto a white background before capturing so black ink is always visible
  const canvas  = document.getElementById('sig-canvas');
  const tmp     = document.createElement('canvas');
  tmp.width     = canvas.width;
  tmp.height    = canvas.height;
  const tmpCtx  = tmp.getContext('2d');
  tmpCtx.fillStyle = '#ffffff';
  tmpCtx.fillRect(0, 0, tmp.width, tmp.height);
  tmpCtx.drawImage(canvas, 0, 0);
  sessionSig = tmp.toDataURL('image/jpeg', 0.8);
  document.getElementById('sig-overlay').style.display = 'none';
  document.getElementById('main-app').style.display    = 'block';
  render();
}

/* ────────────────────────────────────────────
   PASS / FLAG ACTIONS
──────────────────────────────────────────── */
function passItem(bi, itemIdx) {
  const it = BRANCHES[bi].items[itemIdx];
  if (it.na || it.proceed) return;
  const k   = itemKey(bi, itemIdx);
  const rec = state.items[k];
  if (rec && rec.type === 'pass') {
    delete state.items[k]; // toggle off
  } else if (!rec) {
    const d = today();
    state.sigs[d]  = sessionSig;
    state.items[k] = {type:'pass', date:d};
  }
  saveState();
  render();
}

function openFlagPanel(bi, itemIdx, event) {
  event.stopPropagation();
  const rec = state.items[itemKey(bi, itemIdx)];
  if (rec && rec.type === 'flag') return; // already flagged, no edit
  pendingFlag = {bi, itemIdx};
  document.getElementById('flag-note').value = '';
  document.getElementById('flag-panel').classList.add('open');
  document.getElementById('flag-backdrop').classList.add('open');
  setTimeout(() => document.getElementById('flag-note').focus(), 100);
}

function closeFlagPanel() {
  pendingFlag = null;
  document.getElementById('flag-panel').classList.remove('open');
  document.getElementById('flag-backdrop').classList.remove('open');
}

function confirmFlag() {
  if (!pendingFlag) return;
  const note = document.getElementById('flag-note').value.trim();
  if (!note) { document.getElementById('flag-note').focus(); return; }
  const {bi, itemIdx} = pendingFlag;
  const d = today();
  state.sigs[d]               = sessionSig;
  state.items[itemKey(bi, itemIdx)] = {type:'flag', date:d, note};
  saveState();
  closeFlagPanel();
  render();
}

/* ────────────────────────────────────────────
   STATS
──────────────────────────────────────────── */
function branchStats(bi) {
  let inspectable = 0, passed = 0, flagged = 0;
  BRANCHES[bi].items.forEach((it, i) => {
    if (it.proceed || it.na) return;
    inspectable++;
    const rec = state.items[itemKey(bi, i)];
    if (rec && rec.type === 'pass') passed++;
    if (rec && rec.type === 'flag') flagged++;
  });
  return {inspectable, passed, flagged, done: passed + flagged};
}

/* ────────────────────────────────────────────
   RENDER
──────────────────────────────────────────── */
const CAM_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>`;
const FLAG_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>`;
const CHECK_ICON = `<svg class="ck" width="12" height="10" viewBox="0 0 12 10" fill="none"><path d="M1 5L4.2 8.5L11 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function renderSummary() {
  let totalInsp = 0, totalPassed = 0, totalFlagged = 0;
  BRANCHES.forEach((_, bi) => {
    const s = branchStats(bi);
    totalInsp   += s.inspectable;
    totalPassed += s.passed;
    totalFlagged+= s.flagged;
  });
  const pct = totalInsp ? Math.round((totalPassed + totalFlagged) / totalInsp * 100) : 0;
  document.getElementById('gsumm').innerHTML =
    `<div class="stat"><div class="stat-n" style="color:#1D9E75">${totalPassed}</div><div class="stat-l">Passed</div></div>` +
    `<div class="stat"><div class="stat-n" style="color:#d4a800">${totalFlagged}</div><div class="stat-l">Flagged</div></div>` +
    `<div class="stat"><div class="stat-n">${totalInsp - totalPassed - totalFlagged}</div><div class="stat-l">Remaining</div></div>` +
    `<div class="stat"><div class="stat-n">${pct}%</div><div class="stat-l">Complete</div></div>`;
}

function renderTabs() {
  document.getElementById('btabs').innerHTML = BRANCHES.map((b, i) => {
    const s      = branchStats(i);
    const allDone = s.done === s.inspectable && s.inspectable > 0;
    return `<button class="tab${i === currentBranch ? ' active' : ''}${allDone ? ' all-done' : ''}" onclick="switchBranch(${i})">
      ${b.name}<span class="badge">${s.done}/${s.inspectable}</span>
    </button>`;
  }).join('');
}

function renderProgress() {
  const s = branchStats(currentBranch);
  document.getElementById('bprog').style.width =
    (s.inspectable ? Math.round(s.done / s.inspectable * 100) : 0) + '%';
}

function renderChecklist() {
  const branch = BRANCHES[currentBranch];
  let html = '';

  branch.items.forEach((it, i) => {
    // Walkthrough dividers — show only when viewing all items
    if (it.proceed) {
      if (currentFilter === 'all') {
        html += `<div class="proceed">&#8594; ${it.proceed}</div>`;
      }
      return;
    }

    const k         = itemKey(currentBranch, i);
    const rec       = state.items[k];
    const isPassed  = rec && rec.type === 'pass';
    const isFlagged = rec && rec.type === 'flag';
    const isDone    = isPassed || isFlagged;

    // Apply filter
    if (currentFilter === 'pending' && (isDone || it.na)) return;
    if (currentFilter === 'passed'  && !isPassed)         return;
    if (currentFilter === 'flagged' && !isFlagged)        return;

    const itemCls = isPassed ? ' passed' : isFlagged ? ' flagged' : '';
    const naCls   = it.na ? ' na-item' : '';

    const sigThumb = rec && state.sigs[rec.date]
      ? `<img class="sig-thumb" src="${state.sigs[rec.date]}" alt="signature">`
      : '';

    const metaHtml = it.na
      ? `<span class="na-pill">Sign physical tag</span>`
      : rec
        ? `<div class="imeta">${rec.date}${sigThumb}</div>`
        : '';

    const flagHtml = it.na ? '' : isFlagged
      ? `<button class="icon-btn flag-set" title="Issue flagged">${FLAG_ICON}</button>`
      : `<button class="icon-btn" title="Flag an issue" onclick="openFlagPanel(${currentBranch},${i},event)">${FLAG_ICON}</button>`;

    const camHtml = `<button class="icon-btn" title="View photo" onclick="openPhoto(${currentBranch},'${it.photoNum}',event,'${it.t}','${it.l.replace(/'/g,"\\'")}','${branch.folder}')">${CAM_ICON}</button>`;

    const noteHtml = isFlagged
      ? `<div class="iflag-note">&#9888; ${rec.note}</div>`
      : '';

    html += `
      <div class="item${itemCls}${naCls}">
        <div class="circle" onclick="passItem(${currentBranch},${i})">${CHECK_ICON}</div>
        <div class="iinfo"  onclick="passItem(${currentBranch},${i})">
          <div class="itype">${it.t}</div>
          <div class="iloc">${it.l}</div>
          ${noteHtml}
        </div>
        <div class="item-right">
          ${metaHtml}
          ${flagHtml}
          ${camHtml}
        </div>
      </div>`;
  });

  document.getElementById('cl').innerHTML = html || '<div class="empty">No items to show.</div>';
}

function render() {
  renderSummary();
  renderTabs();
  renderProgress();
  renderChecklist();
}

function switchBranch(i) { currentBranch = i; render(); }

function setF(f, el) {
  currentFilter = f;
  document.querySelectorAll('.fbtn').forEach(x => x.classList.remove('active'));
  el.classList.add('active');
  renderChecklist();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 2200);
}

/* ────────────────────────────────────────────
   PHOTO LIGHTBOX
──────────────────────────────────────────── */
function openPhoto(bi, numStr, event, type, loc, folder) {
  event.stopPropagation();
  document.getElementById('lb-title').textContent = type + ' — ' + loc;
  document.getElementById('lb-sub').textContent   = BRANCHES[bi].name + ' Branch  •  Photo #' + numStr;

  const wrap = document.getElementById('lb-img-wrap');
  wrap.innerHTML = '<div style="color:#aaa;font-size:13px">Loading…</div>';

  function tryLoad(src, fallback) {
    const img = new Image();
    img.style.cssText = 'max-width:100%;max-height:70vh;border-radius:8px;object-fit:contain';
    img.onload  = () => { wrap.innerHTML = ''; wrap.appendChild(img); };
    img.onerror = fallback;
    img.src = src;
  }

  tryLoad(
    `photos/${folder}/${numStr}.jpg`,
    () => tryLoad(
      `photos/${folder}/${numStr}.JPG`,
      () => { wrap.innerHTML = `<div class="lb-no-photo">No photo on file yet.<br><span style="font-size:11px;opacity:.6">Add photos/${folder}/${numStr}.jpg to the repository.</span></div>`; }
    )
  );

  document.getElementById('lb').classList.add('open');
}

function closeLB(event) {
  if (!event || event.target === document.getElementById('lb') || event.target.classList.contains('lb-close')) {
    document.getElementById('lb').classList.remove('open');
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.getElementById('lb').classList.remove('open');
    closeFlagPanel();
  }
});

/* ────────────────────────────────────────────
   PDF EXPORT
──────────────────────────────────────────── */
function closeReport() {
  document.getElementById('report-overlay').style.display = 'none';
}

function doExport() {
  const d = today();

  // Collect all flagged items for the summary section
  const allFlagged = [];
  BRANCHES.forEach((branch, bi) => {
    branch.items.forEach((it, i) => {
      if (it.proceed) return;
      const rec = state.items[itemKey(bi, i)];
      if (rec && rec.type === 'flag') allFlagged.push({branchName:branch.name, it, rec});
    });
  });

  // Build per-branch tables
  const branchHTML = BRANCHES.map((branch, bi) => {
    const s = branchStats(bi);
    const rows = branch.items.map((it, i) => {
      if (it.proceed) return ''; // proceed notes omitted from report
      const rec = state.items[itemKey(bi, i)];
      const sig = rec && state.sigs[rec.date]
        ? `<img src="${state.sigs[rec.date]}" style="height:18px;max-width:60px;vertical-align:middle;opacity:.9;border:1px solid #eee;border-radius:3px;background:#fff">`
        : '';
      let statusCell, rowClass = '';
      if (it.na) {
        statusCell = `<td class="status"><span class="tag-pill">Sign physical tag</span></td><td></td><td></td>`;
      } else if (!rec) {
        statusCell = `<td class="status pending">Pending</td><td></td><td></td>`;
      } else if (rec.type === 'pass') {
        statusCell = `<td class="status pass">Pass</td><td class="date-cell">${rec.date}</td><td class="sig-cell">${sig}</td>`;
      } else {
        rowClass   = ' class="flag-row"';
        statusCell = `<td class="status flag">&#9888; Flagged</td><td class="date-cell">${rec.date}</td><td class="sig-cell">${sig}</td>`;
      }
      const noteRow = (rec && rec.type === 'flag')
        ? `<tr${rowClass}><td colspan="2" style="padding:0 8px 6px 28px;font-size:9pt;color:#856404;font-style:italic">Note: ${rec.note}</td><td colspan="2"></td></tr>`
        : '';
      return `<tr${rowClass}><td class="rc-type">${it.t}</td><td class="rc-loc">${it.l}</td>${statusCell}</tr>${noteRow}`;
    }).join('');

    return `
      <div class="rc-branch">
        <div class="rc-branch-hdr">
          ${branch.name} Branch
          <span class="rc-branch-stat">${s.passed} passed &nbsp;|&nbsp; ${s.flagged} flagged &nbsp;|&nbsp; ${s.inspectable - s.done} pending</span>
        </div>
        <table class="rc-table">
          <thead><tr>
            <th style="width:22%">Type</th>
            <th>Location</th>
            <th style="width:10%">Status</th>
            <th style="width:11%">Date</th>
            <th style="width:9%">Signature</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }).join('');

  // Issues summary
  const flagSummary = allFlagged.length === 0
    ? `<div class="rc-no-flags">No issues flagged during this inspection.</div>`
    : `<table class="rc-flag-table">
        <thead><tr><th>Branch</th><th>Type</th><th>Location</th><th>Issue</th><th>Date</th><th>Sig</th></tr></thead>
        <tbody>
          ${allFlagged.map(({branchName, it, rec}) => {
            const sig = state.sigs[rec.date]
              ? `<img src="${state.sigs[rec.date]}" style="height:18px;max-width:60px;vertical-align:middle;border:1px solid #eee;border-radius:3px;background:#fff">`
              : '';
            return `<tr>
              <td>${branchName}</td><td>${it.t}</td><td>${it.l}</td>
              <td style="color:#856404;font-style:italic">${rec.note}</td>
              <td>${rec.date}</td><td>${sig}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`;

  // Inject into the overlay
  document.getElementById('report-content').innerHTML = `
    <style>
      .rc-report-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem;padding-bottom:.75rem;border-bottom:2px solid #1a1a18;flex-wrap:wrap;gap:8px}
      .rc-report-title{font-size:16pt;font-weight:700}
      .rc-report-sub{font-size:10pt;color:#666;margin-top:3px}
      .rc-report-meta{font-size:10pt;color:#444;text-align:right;line-height:1.7}
      .rc-section-hdr{font-size:12pt;font-weight:700;margin:1.2rem 0 .4rem;padding:.3rem .5rem;background:#1a1a18;color:#fff;border-radius:3px}
      .rc-flag-table{width:100%;border-collapse:collapse;margin-bottom:.5rem;font-size:9pt}
      .rc-flag-table th{background:#d4a800;color:#fff;padding:4px 8px;text-align:left}
      .rc-flag-table td{padding:4px 8px;border-bottom:1px solid #f0e0a0;vertical-align:middle}
      .rc-flag-table tr:nth-child(even) td{background:#fffbee}
      .rc-no-flags{padding:.5rem;font-size:10pt;color:#888;font-style:italic}
      .rc-branch{margin-bottom:1.2rem;page-break-inside:avoid}
      .rc-branch-hdr{font-size:11pt;font-weight:700;padding:.3rem .5rem;background:#f0f0f0;border-left:4px solid #1a1a18;margin-bottom:.3rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px}
      .rc-branch-stat{font-size:9pt;font-weight:400;color:#666}
      .rc-table{width:100%;border-collapse:collapse;font-size:9pt}
      .rc-table th{background:#333;color:#fff;padding:4px 8px;text-align:left;font-weight:600}
      .rc-table td{padding:4px 8px;border-bottom:1px solid #e8e8e8;vertical-align:middle}
      .rc-type{font-weight:600}
      .rc-loc{color:#444}
      .date-cell{white-space:nowrap}
      .sig-cell{text-align:center}
      .status{font-weight:600;white-space:nowrap}
      .status.pass{color:#0F6E56}
      .status.flag{color:#856404}
      .status.pending{color:#aaa;font-weight:400}
      .flag-row td{background:#fffbee}
      .tag-pill{font-size:8pt;padding:1px 6px;border-radius:10px;background:#fff3cd;color:#856404;border:1px solid #ffe083;font-weight:400}
    </style>
    <div class="rc-report-hdr">
      <div>
        <div class="rc-report-title">Safety Inspection Report</div>
        <div class="rc-report-sub">Wicomico Public Library</div>
      </div>
      <div class="rc-report-meta">Generated: ${new Date().toLocaleString()}</div>
    </div>
    <div class="rc-section-hdr">&#9888; Issues Requiring Attention</div>
    ${flagSummary}
    ${branchHTML}
  `;

  document.getElementById('report-overlay').style.display = 'block';
  window.scrollTo(0, 0);
}

/* ────────────────────────────────────────────
   RESET
──────────────────────────────────────────── */
function doReset() {
  if (!confirm(`Reset all inspections for ${BRANCHES[currentBranch].name} branch?`)) return;
  BRANCHES[currentBranch].items.forEach((_, i) => delete state.items[itemKey(currentBranch, i)]);
  saveState();
  render();
  showToast(`${BRANCHES[currentBranch].name} reset.`);
}

function doResetAll() {
  if (!confirm('Reset ALL branches? This cannot be undone.')) return;
  state = {items:{}, sigs:{}};
  saveState();
  render();
  showToast('All branches reset.');
}

/* ────────────────────────────────────────────
   INIT
──────────────────────────────────────────── */
loadState();
checkStorage();
initSigPad();
</script>
